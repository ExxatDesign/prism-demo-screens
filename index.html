<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exxat Demo Screens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var key = "exxat-prism-color-theme";
        var valid = [
          "theme-blue-light",
          "theme-blue-dark",
          "theme-purple-light",
          "theme-purple-dark",
          "theme-highcontrast-light",
          "theme-highcontrast-dark",
        ];
        var theme = localStorage.getItem(key);
        if (valid.indexOf(theme) === -1) theme = "theme-blue-light";
        document.documentElement.classList.add(theme);
        if (theme.indexOf("-dark") !== -1) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        } else {
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
    <!-- Same Pro kit as Exxat Home — required for fa-light / fa-solid icons in STEPS demos. -->
    <script
      src="https://kit.fontawesome.com/d9bd5774e0.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
